[package]
name = "pctx"
version = "0.1.0-dev"
edition = "2024"
license = "MIT"
description = "Portable project context and local work coordination"
repository = "https://github.com/Jung95/pctx"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "0.9"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
regex = "1"
ignore = "0.4"
globset = "0.4"
fs2 = "0.4"
libc = "0.2"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
