name: Rust validation
run-name: Rust validation · ${{ inputs.scope || 'full' }}
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Native failure diagnostic or full platform validation
        type: choice
        default: windows-publication
        options:
          - windows-publication
          - full
concurrency:
  group: rust-validation-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.scope == 'windows-publication' && '["windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'windows-publication' && 10 || 30 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.lock') }}
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Native Windows containment primitives
        if: runner.os == 'Windows' && inputs.scope != 'windows-publication'
        run: cargo test --locked --test windows_process
      - name: Native Windows finite query supervision
        if: runner.os == 'Windows' && inputs.scope != 'windows-publication'
        run: cargo test --locked --lib query_process
      - name: Native Windows atomic publication
        if: runner.os == 'Windows'
        run: cargo test --locked --test atomic_publication
      - name: Native Windows keeper ownership
        if: runner.os == 'Windows'
        run: cargo test --locked --test windows_guardian
      - name: Native Windows reader and CLI boundaries
        if: runner.os == 'Windows' && inputs.scope != 'windows-publication'
        run: cargo test --locked --test reader_policy_cache --test cli_contract
      - name: Static checks
        if: inputs.scope != 'windows-publication'
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit and integration tests
        if: inputs.scope != 'windows-publication'
        run: cargo test --locked
      - name: Save dependency and build cache after failed diagnostics
        if: always() && steps.rust-cache.outputs.cache-hit != 'true' && steps.rust-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
